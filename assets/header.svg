<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Woojin Nam · AI Agent and Ontology">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F17"/><stop offset="1" stop-color="#17121A"/></linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.5" r="0.45"><stop offset="0" stop-color="#D97757" stop-opacity="0.22"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
</defs>
<style>
.e{stroke:#ffffff;stroke-opacity:.14;stroke-width:1.4;fill:none}
.f{stroke:#D97757;stroke-width:2;fill:none;stroke-dasharray:10 190;stroke-linecap:round;animation:flow 3.2s linear infinite}
.n{animation:pulse 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.lbl{font-family:Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;font-size:15px;font-weight:600;fill:#E6E8EE}
.name{font-family:Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;font-size:56px;font-weight:800;fill:#fff;letter-spacing:-1.5px}
.ko{font-family:Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;font-size:24px;font-weight:600;fill:#C9CDD6}
.tag{font-family:Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;font-size:17px;fill:#9AA1AE}
.chip{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'D2Coding', monospace;font-size:13px;fill:#D97757}
.fade{animation:in 1.2s ease-out both}
@keyframes flow{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.f,.n,.fade{animation:none}}
</style>
<rect width="1200" height="380" rx="18" fill="url(#bg)"/>
<rect width="1200" height="380" rx="18" fill="url(#dots)"/>
<rect width="1200" height="380" rx="18" fill="url(#glow)"/>
