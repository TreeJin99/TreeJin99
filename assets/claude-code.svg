<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Claude Code multi-agent run">
<style>text{font-family:'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'D2Coding', monospace;font-size:15px;white-space:pre;fill:#E6E8EE}
.cur{fill:#E8622A;animation:blink 1s steps(2) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes l0{0%,2.86%{opacity:0;transform:translateY(6px)}5.36%,96%{opacity:1;transform:none}100%{opacity:0}}
.l0{animation:l0 14.0s ease-out infinite}
@keyframes l1{0%,9.29%{opacity:0;transform:translateY(6px)}11.79%,96%{opacity:1;transform:none}100%{opacity:0}}
.l1{animation:l1 14.0s ease-out infinite}
@keyframes l2{0%,15.71%{opacity:0;transform:translateY(6px)}18.21%,96%{opacity:1;transform:none}100%{opacity:0}}
.l2{animation:l2 14.0s ease-out infinite}
@keyframes t2{0%,15.71%{width:0}28.57%,100%{width:900px}}
#c2 rect{animation:t2 14.0s steps(40) infinite}
@keyframes l3{0%,31.43%{opacity:0;transform:translateY(6px)}33.93%,96%{opacity:1;transform:none}100%{opacity:0}}
.l3{animation:l3 14.0s ease-out infinite}
@keyframes l4{0%,39.29%{opacity:0;transform:translateY(6px)}41.79%,96%{opacity:1;transform:none}100%{opacity:0}}
.l4{animation:l4 14.0s ease-out infinite}
@keyframes l5{0%,47.14%{opacity:0;transform:translateY(6px)}49.64%,96%{opacity:1;transform:none}100%{opacity:0}}
.l5{animation:l5 14.0s ease-out infinite}
@keyframes l6{0%,55.00%{opacity:0;transform:translateY(6px)}57.50%,96%{opacity:1;transform:none}100%{opacity:0}}
.l6{animation:l6 14.0s ease-out infinite}
@keyframes l7{0%,62.86%{opacity:0;transform:translateY(6px)}65.36%,96%{opacity:1;transform:none}100%{opacity:0}}
.l7{animation:l7 14.0s ease-out infinite}
@keyframes l8{0%,70.71%{opacity:0;transform:translateY(6px)}73.21%,96%{opacity:1;transform:none}100%{opacity:0}}
.l8{animation:l8 14.0s ease-out infinite}
@media (prefers-reduced-motion:reduce){text,rect{animation:none!important;opacity:1!important}}</style>
<defs><linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211814"/><stop offset="1" stop-color="#140E0B"/></linearGradient></defs>
<rect width="1000" height="540" rx="16" fill="url(#tb)"/>
<rect x="0.5" y="0.5" width="999" height="539" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<circle cx="28" cy="26" r="6" fill="#FF5F57"/><circle cx="48" cy="26" r="6" fill="#FEBC2E"/><circle cx="68" cy="26" r="6" fill="#28C840"/>
<text x="500.0" y="31" text-anchor="middle" fill="#6B7280" style="font-size:13px">claude · galrae · multi-agent</text>
<line x1="0" y1="50" x2="1000" y2="50" stroke="#ffffff" stroke-opacity="0.06"/>
<text x="48" y="92" class="l0"><tspan fill="#86EFAC">~/galrae</tspan> <tspan fill="#9AA1AE">❯</tspan> claude</text>
<text x="48" y="132" class="l1"><tspan fill="#E8622A">✻</tspan> <tspan fill="#E6E8EE" font-weight="700">Claude Code</tspan> <tspan fill="#6B7280">· jigeum harness · skills 70 · agents 15+</tspan></text>
<clipPath id="c2"><rect x="40" y="164" height="34" width="0"/></clipPath>
<rect x="32" y="160" width="936" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" class="l2"/>
<text x="48" y="186" clip-path="url(#c2)" class="l2"><tspan fill="#9AA1AE">&gt;</tspan> <tspan fill="#F3F4F6">원청 서식 3종을 온톨로지로 묶고, 점검 보고서 초안까지 써줘</tspan></text>
<g class="l3"><text x="48" y="240"><tspan fill="#D97757">⏺</tspan> <tspan fill="#E6E8EE">Agent</tspan><tspan fill="#9AA1AE">(researcher)</tspan></text><text x="350" y="240" fill="#9AA1AE" style="fill:#9AA1AE">서식·법령 분석</text><text x="640" y="240" style="fill:#86EFAC;font-weight:700">✓ 서식 3 · 조문 18</text></g>
<g class="l4"><text x="48" y="280"><tspan fill="#D97757">⏺</tspan> <tspan fill="#E6E8EE">Skill</tspan><tspan fill="#9AA1AE">(ontology)</tspan></text><text x="350" y="280" fill="#9AA1AE" style="fill:#9AA1AE">양식·규칙·지식 연결</text><text x="640" y="280" style="fill:#86EFAC;font-weight:700">✓ 규칙 42</text></g>
<g class="l5"><text x="48" y="320"><tspan fill="#D97757">⏺</tspan> <tspan fill="#E6E8EE">Agent</tspan><tspan fill="#9AA1AE">(drafter ×3)</tspan></text><text x="350" y="320" fill="#9AA1AE" style="fill:#9AA1AE">worktree 병렬 초안</text><text x="640" y="320" style="fill:#86EFAC;font-weight:700">✓ 초안 3</text></g>
<g class="l6"><text x="48" y="360"><tspan fill="#D97757">⏺</tspan> <tspan fill="#E6E8EE">Agent</tspan><tspan fill="#9AA1AE">(reviewer)</tspan></text><text x="350" y="360" fill="#9AA1AE" style="fill:#9AA1AE">작성자와 분리된 검수</text><text x="640" y="360" style="fill:#86EFAC;font-weight:700">✓ 확인 필요 0</text></g>
<g class="l7"><text x="48" y="400"><tspan fill="#A5B4FC">⏺</tspan> <tspan fill="#E6E8EE">Hook</tspan><tspan fill="#9AA1AE">(bans · audit)</tspan></text><text x="350" y="400" fill="#9AA1AE" style="fill:#9AA1AE">금지 패턴·품질 게이트</text><text x="640" y="400" style="fill:#86EFAC;font-weight:700">✓ FAIL 0</text></g>
<text x="48" y="454" class="l8"><tspan fill="#86EFAC" font-weight="700">✓ 점검보고서.hwpx 완성</tspan>  <tspan fill="#6B7280">· 3m 41s · 근거 조문 첨부</tspan></text>
